<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market Desk</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1220">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1220; --bg-rgb:11,18,32; --panel:#111B2E; --panel-2:#0E1729; --line:#1E2C46;
    --ink:#E7ECF5; --ink-dim:#8FA0BE; --ink-faint:#5A6A87;
    --amber:#E3A63E; --amber-dim:#8A6A2E; --amber-ink:#241A08;
    --green:#3FBF7F; --green-dim:#1F4A38;
    --red:#E0596B; --red-dim:#4A2530;
    --radius:14px;
  }
  :root[data-theme="light"]{
    --bg:#F4F5F8; --bg-rgb:244,245,248; --panel:#FFFFFF; --panel-2:#ECEEF3; --line:#DDE1EA;
    --ink:#101827; --ink-dim:#51607A; --ink-faint:#8994A8;
    --amber:#B6791A; --amber-dim:#F2E2C4; --amber-ink:#FFFFFF;
    --green:#1C8A57; --green-dim:#D9F1E4;
    --red:#C93B54; --red-dim:#FBDDE3;
  }
  body{transition:background-color 0.15s ease, color 0.15s ease;}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif; -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
  }
  .mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  a{color:inherit;}

  header{
    padding:22px 20px 18px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:rgba(var(--bg-rgb),0.92); backdrop-filter:blur(8px);
    z-index:10;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--amber); margin:0 0 6px;
  }
  h1{font-size:22px; margin:0; font-weight:600; letter-spacing:-0.01em;}
  .updated{font-size:12px; color:var(--ink-faint); margin-top:4px;}
  .updated.stale{color:var(--red);}

  .theme-toggle{
    background:var(--panel-2); border:1px solid var(--line); color:var(--ink-dim);
    width:34px; height:34px; border-radius:10px; font-size:16px; cursor:pointer;
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  .theme-toggle:hover{border-color:var(--amber); color:var(--amber);}

  .ticker-tape{
    background:var(--panel-2); border-bottom:1px solid var(--line);
    overflow:hidden; white-space:nowrap; position:relative;
  }
  .ticker-tape-track{
    display:inline-flex; animation:tape-scroll 45s linear infinite;
  }
  .ticker-tape:hover .ticker-tape-track{animation-play-state:paused;}
  @keyframes tape-scroll{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }
  .tape-item{
    display:inline-flex; align-items:baseline; gap:8px; padding:10px 20px;
    font-family:'IBM Plex Mono',monospace; font-size:13px; white-space:nowrap;
    border-right:1px solid var(--line);
  }
  .tape-ticker{font-weight:700; color:var(--ink);}
  .tape-price{color:var(--ink-dim);}
  .tape-arrow.up{color:var(--green);}
  .tape-arrow.down{color:var(--red);}
  .tape-arrow.flat{color:var(--ink-faint);}

  .tab-nav{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:4px;}
  .tab-btn{
    flex-shrink:0; background:var(--panel); border:1px solid var(--line); color:var(--ink-dim);
    padding:10px 16px; border-radius:12px; font-weight:600; font-size:14px; cursor:pointer;
    display:flex; align-items:center; gap:7px; font-family:'IBM Plex Sans',sans-serif;
  }
  .tab-btn .tab-count{
    font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:500;
    background:var(--panel-2); padding:1px 7px; border-radius:999px; color:var(--ink-faint);
  }
  .tab-btn.active{border-color:var(--green); color:var(--green); background:var(--green-dim);}
  .tab-btn.active .tab-count{background:transparent; color:var(--green);}
  .tab-btn[data-tab="SELL"].active{border-color:var(--red); color:var(--red); background:var(--red-dim);}
  .tab-btn[data-tab="SELL"].active .tab-count{color:var(--red);}
  .tab-btn[data-tab="WATCHLIST"].active,
  .tab-btn[data-tab="ALL"].active,
  .tab-btn[data-tab="PORTFOLIO"].active{
    border-color:var(--amber); color:var(--amber); background:var(--amber-dim);
  }
  .tab-btn[data-tab="WATCHLIST"].active .tab-count,
  .tab-btn[data-tab="ALL"].active .tab-count,
  .tab-btn[data-tab="PORTFOLIO"].active .tab-count{color:var(--amber);}

  .score-badge{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint);
  }
  .trend-badge{
    display:inline-block; font-size:11px; font-weight:600; padding:3px 10px;
    border-radius:999px; margin-left:8px;
  }
  .trend-badge.bullish{background:var(--green-dim); color:var(--green);}
  .trend-badge.bearish{background:var(--red-dim); color:var(--red);}
  .trend-badge.neutral{background:var(--panel-2); color:var(--ink-faint);}
  .recommended-tag{
    font-size:10px; font-weight:700; letter-spacing:0.04em; color:var(--amber);
    border:1px solid var(--amber-dim); border-radius:5px; padding:1px 6px; margin-left:6px;
  }
  .stat-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px;}
  .stat-box{background:var(--panel-2); border-radius:10px; padding:8px 10px;}
  .stat-box .stat-label{
    font-size:9.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.04em;
    font-family:'IBM Plex Mono',monospace; margin-bottom:3px;
  }
  .stat-box .stat-value{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px;}
  .stat-box .stat-value .up{color:var(--green);}

  .hero{padding:20px; display:flex; flex-direction:column; gap:4px;}
  .hero-value{font-family:'IBM Plex Mono',monospace; font-size:40px; font-weight:600; letter-spacing:-0.02em;}
  .hero-sub{display:flex; gap:14px; font-size:14px; color:var(--ink-dim);}
  .pill{
    display:inline-flex; align-items:center; gap:5px; padding:3px 9px;
    border-radius:999px; font-size:13px; font-family:'IBM Plex Mono',monospace; font-weight:500;
  }
  .pill.up{background:var(--green-dim); color:var(--green);}
  .pill.down{background:var(--red-dim); color:var(--red);}

  section{padding:8px 20px 4px;}
  .section-title{
    font-size:12px; text-transform:uppercase; letter-spacing:0.12em;
    color:var(--ink-faint); margin:22px 0 10px; display:flex; justify-content:space-between; align-items:center;
  }
  .section-title .count{color:var(--ink-dim); font-family:'IBM Plex Mono',monospace;}
  .section-collapse-btn{
    background:var(--panel-2); border:1px solid var(--line); color:var(--ink-dim);
    width:22px; height:22px; border-radius:6px; font-family:'IBM Plex Mono',monospace;
    font-size:14px; line-height:1; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; margin-left:8px;
  }
  .section-collapse-btn:hover{border-color:var(--amber); color:var(--amber);}
  .section-body.collapsed{display:none;}


  .alert-card{
    background:var(--panel); border:1px solid var(--amber-dim); border-left:3px solid var(--amber);
    border-radius:var(--radius); padding:13px 14px; margin-bottom:9px;
  }
  .alert-card.warn{border-left-color:var(--red); border-color:var(--red-dim);}
  .alert-card.buy{border-left-color:var(--green); border-color:var(--green-dim);}
  .alert-title{font-weight:600; font-size:14px; margin-bottom:3px;}
  .alert-msg{font-size:13px; color:var(--ink-dim); line-height:1.4;}

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:9px;
  }
  .card-top{display:flex; justify-content:space-between; align-items:baseline;}
  .ticker-block{display:flex; align-items:baseline; gap:8px;}
  .ticker{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:16px;}
  .company{font-size:12px; color:var(--ink-faint); max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .price{font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:600;}
  .card-mid{display:flex; justify-content:space-between; margin-top:8px; font-size:12px; color:var(--ink-dim);}
  .card-mid .val{color:var(--ink); font-family:'IBM Plex Mono',monospace;}
  .card-bottom{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .tag{
    font-size:10.5px; font-family:'IBM Plex Mono',monospace; padding:2px 7px;
    border-radius:5px; letter-spacing:0.03em; text-transform:uppercase; font-weight:600;
  }
  .tag.buy{background:var(--green-dim); color:var(--green);}
  .tag.sell{background:var(--red-dim); color:var(--red);}
  .tag.watch{background:#3A3320; color:var(--amber);}
  .tag.rising{background:var(--green-dim); color:var(--green);}
  .tag.falling{background:var(--red-dim); color:var(--red);}
  .tag.flat{background:#20293D; color:var(--ink-dim);}
  .tag.held{background:#20293D; color:var(--ink-dim); border:1px solid var(--line);}

  .empty{color:var(--ink-faint); font-size:13px; padding:16px 0; text-align:center;}

  .card.expandable{cursor:pointer;}
  .card-detail{
    display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--line);
  }
  .card-detail.open{display:block;}
  .detail-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; font-size:12px;
  }
  .detail-grid .dlabel{color:var(--ink-faint);}
  .caution-note{
    grid-column:1 / -1; font-size:11px; color:var(--amber); background:var(--amber-dim);
    border-radius:8px; padding:6px 10px; margin-top:2px;
  }
  .detail-grid .dval{color:var(--ink); font-family:'IBM Plex Mono',monospace; text-align:right;}
  .expand-hint{font-size:10.5px; color:var(--ink-faint); text-align:center; margin-top:8px;
    font-family:'IBM Plex Mono',monospace; letter-spacing:0.03em;}

  .search-row{display:flex; gap:8px; margin-bottom:10px;}
  .search-input{
    flex:1; background:var(--panel); border:1px solid var(--line); border-radius:10px;
    color:var(--ink); padding:10px 12px; font-family:'IBM Plex Sans',sans-serif; font-size:14px;
  }
  .search-input:focus{outline:none; border-color:var(--amber);}
  .filter-row{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;}
  .filter-chip{
    font-family:'IBM Plex Mono',monospace; font-size:11px; padding:5px 11px;
    border-radius:999px; border:1px solid var(--line); color:var(--ink-dim);
    background:transparent; cursor:pointer; letter-spacing:0.02em;
  }
  .filter-chip.active{background:var(--amber); color:var(--amber-ink); border-color:var(--amber); font-weight:600;}
  .result-count{font-size:11px; color:var(--ink-faint); margin:6px 2px 10px; font-family:'IBM Plex Mono',monospace;}

  footer{padding:26px 20px 10px; font-size:11px; color:var(--ink-faint); text-align:center; line-height:1.6;}

  @media (min-width:640px){
    .hero-value{font-size:48px;}
    section{padding-left:32px; padding-right:32px;}
    header{padding-left:32px; padding-right:32px;}
  }
</style>
<script>
  // Runs before the page paints, so there's no flash of the wrong theme
  (function(){
    const saved = localStorage.getItem('market-desk-theme');
    if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>
</head>
<body>

<header>
  <div style="display:flex; justify-content:space-between; align-items:flex-start;">
    <div>
      <p class="eyebrow">Market Desk</p>
      <h1>Portfolio &amp; Recommendations</h1>
    </div>
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle light/dark theme" title="Toggle light/dark theme">◐</button>
  </div>
  <div class="updated" id="updated">Loading…</div>
</header>

<div class="ticker-tape" id="tickerTape">
  <div class="ticker-tape-track" id="tickerTapeTrack"></div>
</div>

<div class="hero">
  <div class="hero-value mono" id="totalValue">—</div>
  <div class="hero-sub">
    <span id="totalGain" class="pill">—</span>
    <span id="dataMode" style="color:var(--ink-faint);"></span>
  </div>
</div>

<section>
  <div class="section-title">Alerts <span class="count" id="alertCount"></span></div>
  <div id="alerts"><div class="empty">No alerts right now.</div></div>
</section>

<section>
  <div class="tab-nav" id="tabNav">
    <button class="tab-btn active" data-tab="BUY">Buy <span class="tab-count" id="countBuy">0</span></button>
    <button class="tab-btn" data-tab="WATCHLIST">Watch <span class="tab-count" id="countWatch">0</span></button>
    <button class="tab-btn" data-tab="SELL">Sell <span class="tab-count" id="countSell">0</span></button>
    <button class="tab-btn" data-tab="ALL">All Stocks <span class="tab-count" id="countAll">0</span></button>
    <button class="tab-btn" data-tab="PORTFOLIO">Portfolio <span class="tab-count" id="countPortfolio">0</span></button>
  </div>
  <div class="search-row">
    <input type="text" class="search-input" id="tickerSearch" placeholder="Search by ticker or name…">
  </div>
  <div class="result-count" id="resultCount"></div>
  <div id="tabContent"><div class="empty">No data loaded yet.</div></div>
</section>

<footer>
  Data from your local screener pipeline · $1K/month planning tool, not financial advice<br>
  Figures reflect the last time the data was published, not live market ticks
</footer>

<script>
const fmtMoney = (v) => v === null || v === undefined ? '—' :
  (v < 0 ? '-$' + Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})
         : '$' + v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}));
const fmtPct = (v) => v === null || v === undefined ? '—' : (v*100 >= 0 ? '+' : '') + (v*100).toFixed(1) + '%';
const trendTag = (t) => {
  const cls = t === 'RISING' ? 'rising' : t === 'FALLING' ? 'falling' : 'flat';
  return `<span class="tag ${cls}">${t || 'N/A'}</span>`;
};
const signalTag = (s) => {
  const cls = s === 'BUY' ? 'buy' : s === 'SELL' ? 'sell' : 'watch';
  return `<span class="tag ${cls}">${s || '—'}</span>`;
};

function renderAlerts(holdings, top20){
  const alerts = [];
  holdings.forEach(h => {
    if (h.macd_trend === 'FALLING'){
      alerts.push({type:'warn', title:`⚠️ ${h.ticker} momentum turning bearish`,
        msg:`MACD histogram falling at ${fmtMoney(h.current_price)}.`});
    }
    if (h.analyst_target && h.current_price >= h.analyst_target){
      alerts.push({type:'', title:`🎯 ${h.ticker} hit analyst target`,
        msg:`At ${fmtMoney(h.current_price)}, at/above target ${fmtMoney(h.analyst_target)}.`});
    }
    if (h.gain_pct !== null && h.gain_pct <= -0.10){
      alerts.push({type:'warn', title:`🔻 ${h.ticker} down ${fmtPct(h.gain_pct)}`,
        msg:`Down from your average cost of ${fmtMoney(h.avg_cost)}.`});
    }
  });
  top20.forEach(r => {
    if (!r.already_held && r.current_price && r.suggested_entry && r.current_price <= r.suggested_entry){
      alerts.push({type:'buy', title:`💰 ${r.ticker} at suggested entry`,
        msg:`${fmtMoney(r.current_price)} has reached the ${fmtMoney(r.suggested_entry)} entry.`});
    }
  });

  document.getElementById('alertCount').textContent = alerts.length ? `(${alerts.length})` : '';
  const el = document.getElementById('alerts');
  if (!alerts.length){ el.innerHTML = '<div class="empty">No alerts right now.</div>'; return; }
  el.innerHTML = alerts.map(a => `
    <div class="alert-card ${a.type}">
      <div class="alert-title">${a.title}</div>
      <div class="alert-msg">${a.msg}</div>
    </div>`).join('');
}

function trendBadge(trend){
  const cls = trend === 'RISING' ? 'bullish' : trend === 'FALLING' ? 'bearish' : 'neutral';
  const text = trend === 'RISING' ? 'Strengthening (Bullish)' : trend === 'FALLING' ? 'Weakening (Bearish)' : 'Neutral';
  return `<span class="trend-badge ${cls}">${text}</span>`;
}

function fmtCompact(v){
  if (v === null || v === undefined || v === '') return '—';
  const n = Number(v);
  if (isNaN(n)) return '—';
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return String(n);
}

let ALL_TICKERS = [];
let TOP20_SET = new Set();
let HOLDINGS = [];
let activeTab = 'BUY';

// --- Screener-style card: Buy / Watch / Sell / All Stocks tabs ---
function screenerCard(t, i){
  const upside = (t.analyst_target && t.current_price) ? (t.analyst_target - t.current_price) / t.current_price : null;
  const isRecommended = TOP20_SET.has(t.ticker);
  return `
    <div class="card expandable" onclick="toggleTickerDetail(${i})">
      <div class="card-top">
        <div class="ticker-block">
          <span class="ticker">${t.ticker}</span>
          ${isRecommended ? '<span class="recommended-tag">TOP 20</span>' : ''}
        </div>
        <div style="text-align:right;">
          <div class="price mono">${fmtMoney(t.current_price)}</div>
          <div class="score-badge">Score ${t.matrix_score ?? '—'}</div>
        </div>
      </div>
      <div class="company" style="margin:-4px 0 8px;">${t.company || ''}</div>
      <div class="card-mid">
        <span>RSI ${t.rsi ?? '—'} · Trend ${t.macd_trend || 'N/A'}</span>
        ${trendBadge(t.macd_trend)}
      </div>
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-label">Entry - EMA20</div><div class="stat-value">${fmtMoney(t.ema20)}</div></div>
        <div class="stat-box"><div class="stat-label">Entry - Support</div><div class="stat-value">${fmtMoney(t.suggested_entry)}</div></div>
        <div class="stat-box"><div class="stat-label">Target Price</div><div class="stat-value">${fmtMoney(t.analyst_target)}${upside !== null ? ` <span class="up">${fmtPct(upside)}</span>` : ''}</div></div>
      </div>
      <div class="card-detail" id="detail-${i}">
        <div class="detail-grid">
          <span class="dlabel">EMA20 / EMA40</span><span class="dval">${fmtMoney(t.ema20)} / ${fmtMoney(t.ema40)}</span>
          <span class="dlabel">Support / Resistance</span><span class="dval">${fmtMoney(t.support_lower_bb)} / ${fmtMoney(t.resistance_upper_bb)}</span>
          <span class="dlabel">Middle BB</span><span class="dval">${fmtMoney(t.middle_bb)}</span>
          <span class="dlabel">52W High</span><span class="dval">${fmtMoney(t.high_52w_price)} (${t.high_52w_drop_pct || '—'})</span>
          <span class="dlabel">MACD Line / Signal</span><span class="dval">${t.macd_line ?? '—'} / ${t.macd_signal ?? '—'}</span>
          <span class="dlabel">MACD Histogram</span><span class="dval">${t.macd_histogram ?? '—'}</span>
          <span class="dlabel">Volume (today / 200SMA)</span><span class="dval">${fmtCompact(t.current_vol)} / ${fmtCompact(t.vol_200sma)}</span>
          <span class="dlabel">Volume Strength</span><span class="dval">${t.volume_strength || '—'}</span>
          <span class="dlabel">R/R Ratio</span><span class="dval">${t.rr_ratio ?? '—'}</span>
          ${t.rr_note ? `<div class="caution-note">⚠ ${t.rr_note}</div>` : ''}
          <span class="dlabel">Intrinsic Value</span><span class="dval">${fmtMoney(t.intrinsic_value)}</span>
          <span class="dlabel">Margin of Safety</span><span class="dval">${t.margin_of_safety || '—'}</span>
          <span class="dlabel">Analyst Upside</span><span class="dval">${t.analyst_upside_pct || '—'}</span>
          <span class="dlabel">Put/Call OI Ratio</span><span class="dval">${t.put_call_ratio ?? '—'}</span>
          <span class="dlabel">Put Wall (Floor)</span><span class="dval">${fmtMoney(t.put_wall_price)} · ${fmtCompact(t.put_wall_oi)} OI</span>
          <span class="dlabel">Call Wall (Ceiling)</span><span class="dval">${fmtMoney(t.call_wall_price)} · ${fmtCompact(t.call_wall_oi)} OI</span>
          ${t.walls_crossed ? `<div class="caution-note">⚠ Put wall is priced above the call wall - unusual, low-confidence options data (common for thinly-traded names). Floor/Ceiling labels may not hold here.</div>` : ''}
          <span class="dlabel">Category</span><span class="dval">${t.category || '—'}</span>
        </div>
      </div>
      <div class="expand-hint">Tap for full technical detail</div>
    </div>`;
}

// --- Holdings-style card: Portfolio tab (your actual position, not screening metrics) ---
function holdingCard(h){
  return `
    <div class="card">
      <div class="card-top">
        <div class="ticker-block">
          <span class="ticker">${h.ticker}</span>
          <span class="company">${h.company || ''}</span>
        </div>
        <span class="price mono">${fmtMoney(h.current_price)}</span>
      </div>
      <div class="card-mid">
        <span>${h.shares} sh · avg ${fmtMoney(h.avg_cost)}</span>
        <span class="val" style="color:${h.gain_dollar >= 0 ? 'var(--green)' : 'var(--red)'}">
          ${fmtMoney(h.gain_dollar)} (${fmtPct(h.gain_pct)})
        </span>
      </div>
      <div class="card-bottom">
        ${trendTag(h.macd_trend)}
        <span class="tag flat">Target ${fmtMoney(h.analyst_target)}</span>
        <span class="tag flat">Weight ${h.weight_pct ? (h.weight_pct*100).toFixed(1)+'%' : '—'}</span>
      </div>
    </div>`;
}

function renderTabContent(){
  const q = document.getElementById('tickerSearch').value.trim().toUpperCase();
  const el = document.getElementById('tabContent');
  const countEl = document.getElementById('resultCount');

  if (activeTab === 'PORTFOLIO'){
    let rows = HOLDINGS;
    if (q) rows = rows.filter(h => (h.ticker || '').toUpperCase().includes(q) || (h.company || '').toUpperCase().includes(q));
    countEl.textContent = `${rows.length} of ${HOLDINGS.length} holdings`;
    if (!rows.length){
      el.innerHTML = HOLDINGS.length ? '<div class="empty">No matches.</div>'
        : '<div class="empty">No holdings yet — add them in Portfolio_Tracker.xlsx.</div>';
      return;
    }
    el.innerHTML = rows.map(holdingCard).join('');
    return;
  }

  let rows = ALL_TICKERS;
  if (activeTab !== 'ALL') rows = rows.filter(t => t.signal === activeTab);
  if (q) rows = rows.filter(t => (t.ticker || '').toUpperCase().includes(q) || (t.company || '').toUpperCase().includes(q));

  countEl.textContent = `${rows.length} of ${activeTab === 'ALL' ? ALL_TICKERS.length : rows.length} tickers`;
  if (!rows.length){ el.innerHTML = '<div class="empty">No matches.</div>'; return; }

  // Cap rendering for very broad queries so an old phone doesn't choke at once
  const capped = rows.slice(0, 150);
  el.innerHTML = capped.map((t, i) => screenerCard(t, i)).join('');
  if (rows.length > 150){
    el.innerHTML += `<div class="empty">Showing first 150 - narrow your search to see more.</div>`;
  }
}

function toggleTickerDetail(i){
  const el = document.getElementById('detail-' + i);
  if (el) el.classList.toggle('open');
}

function updateTabCounts(){
  document.getElementById('countBuy').textContent = ALL_TICKERS.filter(t => t.signal === 'BUY').length;
  document.getElementById('countWatch').textContent = ALL_TICKERS.filter(t => t.signal === 'WATCHLIST').length;
  document.getElementById('countSell').textContent = ALL_TICKERS.filter(t => t.signal === 'SELL').length;
  document.getElementById('countAll').textContent = ALL_TICKERS.length;
  document.getElementById('countPortfolio').textContent = HOLDINGS.length;
}

document.getElementById('tabNav').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeTab = btn.dataset.tab;
  renderTabContent();
});
document.getElementById('tickerSearch').addEventListener('input', renderTabContent);

// --- Scrolling ticker tape ---
function renderTickerTape(items){
  const track = document.getElementById('tickerTapeTrack');
  if (!items.length){ document.getElementById('tickerTape').style.display = 'none'; return; }
  const html = items.map(t => {
    const dir = t.macd_trend === 'RISING' ? 'up' : t.macd_trend === 'FALLING' ? 'down' : 'flat';
    const arrow = dir === 'up' ? '▲' : dir === 'down' ? '▼' : '—';
    return `<span class="tape-item">
      <span class="tape-ticker">${t.ticker}</span>
      <span class="tape-price">${fmtMoney(t.current_price)}</span>
      <span class="tape-arrow ${dir}">${arrow}</span>
    </span>`;
  }).join('');
  // Duplicated once so the marquee loop (translateX -50%) is seamless
  track.innerHTML = html + html;
}

async function load(){
  try{
    // Cache-busting query param defeats GitHub Pages' CDN edge caching -
    // {cache:'no-store'} alone only stops the BROWSER from caching, it has
    // no effect on GitHub's own CDN layer, which can otherwise keep serving
    // a stale (or even a stale 404) response for a while after the file
    // actually changes.
    const res = await fetch('dashboard_data.json?v=' + Date.now(), {cache:'no-store'});
    if (!res.ok){
      throw new Error(`HTTP ${res.status} ${res.statusText} - the file may not have deployed yet, try again in a minute`);
    }
    const data = await res.json();

    const updated = new Date(data.generated_at);
    const ageHours = (Date.now() - updated.getTime()) / 36e5;
    const updEl = document.getElementById('updated');
    updEl.textContent = 'Updated ' + updated.toLocaleString();
    if (ageHours > 30) updEl.classList.add('stale');

    document.getElementById('dataMode').textContent = data.is_real_data ? '' : '· simulated data';

    const p = data.portfolio;
    document.getElementById('totalValue').textContent = fmtMoney(p.total_value);
    const gainEl = document.getElementById('totalGain');
    gainEl.textContent = `${fmtMoney(p.total_gain)} (${fmtPct(p.total_gain_pct)})`;
    gainEl.className = 'pill ' + (p.total_gain >= 0 ? 'up' : 'down');

    renderAlerts(p.holdings, data.top20);

    HOLDINGS = p.holdings;
    ALL_TICKERS = data.all_tickers || [];
    TOP20_SET = new Set((data.top20 || []).map(r => r.ticker));
    updateTabCounts();
    renderTabContent();
    renderTickerTape((data.top20 || []).length ? data.top20 : ALL_TICKERS.slice(0, 20));
  } catch(e){
    document.getElementById('updated').textContent = 'Could not load dashboard_data.json - ' + e.message;
    document.getElementById('updated').classList.add('stale');
    console.error(e);
  }
}

function initThemeToggle(){
  const btn = document.getElementById('themeToggle');
  const isLight = () => document.documentElement.getAttribute('data-theme') === 'light';
  const updateIcon = () => { btn.textContent = isLight() ? '◑' : '◐'; };
  updateIcon();
  btn.addEventListener('click', () => {
    if (isLight()){
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('market-desk-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      localStorage.setItem('market-desk-theme', 'light');
    }
    updateIcon();
  });
}
function initSectionCollapse(btnId, bodyId, storageKey){
  const btn = document.getElementById(btnId);
  const body = document.getElementById(bodyId);
  const isCollapsed = () => body.classList.contains('collapsed');
  const updateSymbol = () => { btn.textContent = isCollapsed() ? '+' : '−'; };

  if (localStorage.getItem(storageKey) === 'collapsed'){
    body.classList.add('collapsed');
  }
  updateSymbol();

  btn.addEventListener('click', () => {
    body.classList.toggle('collapsed');
    localStorage.setItem(storageKey, isCollapsed() ? 'collapsed' : 'expanded');
    updateSymbol();
  });
}
initThemeToggle();

load();
</script>
</body>
</html>
